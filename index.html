<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Bias Sorter 1v1</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #8b5cf6;
      --accent-hover: #7c3aed;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      color: var(--accent-color);
      text-align: center;
      margin-bottom: 10px;
    }

    p.description {
      color: var(--text-muted);
      text-align: center;
      max-width: 600px;
      margin-bottom: 30px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      resize: vertical;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 15px;
    }

    textarea:focus {
      outline: 1px solid var(--accent-color);
    }

    button {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
    }

    .battle-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .progress {
      font-weight: bold;
      color: var(--text-muted);
    }

    .vs-container {
      display: flex;
      gap: 15px;
      width: 100%;
    }

    .card {
      flex: 1;
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 120px;
    }

    .card:hover {
      border-color: var(--accent-color);
      transform: translateY(-2px);
    }

    .card .name {
      font-size: 18px;
      font-weight: bold;
    }

    .card .group {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .results-area {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      color: var(--accent-color);
    }

    td.rank {
      font-weight: bold;
      width: 50px;
    }

    .btn-restart {
      margin-top: 20px;
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }

    .btn-restart:hover {
      background: var(--accent-color);
      color: white;
    }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter 1v1</h1>
  <p class="description">Ingresa tu lista de integrantes e inicia el enfrentamiento 1v1 para descubrir tu ranking exacto.</p>

  <div class="container">
    <div id="setup-screen">
      <textarea id="bias-input" placeholder="Escribe un nombre por línea&#10;Ejemplo:&#10;Gaeun - Purple Kiss&#10;Dosie - Purple Kiss&#10;Yuki - Purple Kiss&#10;Chaein - Purple Kiss&#10;Swan - Purple Kiss"></textarea>
      <button onclick="startSorter()">Comenzar Sorter</button>
    </div>

    <div id="battle-screen" class="battle-area">
      <div id="progress" class="progress">Batalla #1</div>
      <div class="vs-container">
        <div class="card" onclick="pickWinner(0)">
          <div id="name-0" class="name"></div>
          <div id="group-0" class="group"></div>
        </div>
        <div class="card" onclick="pickWinner(1)">
          <div id="name-1" class="name"></div>
          <div id="group-1" class="group"></div>
        </div>
      </div>
    </div>

    <div id="results-screen" class="results-area">
      <h2>Tu Ranking Final</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Grupo</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button class="btn-restart" onclick="resetSorter()">Crear otro Sorter</button>
    </div>
  </div>

  <script>
    let list = [];
    let stateStack = [];
    let battleCount = 0;

    function parseInput(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          const parts = line.split('-').map(p => p.trim());
          return {
            name: parts[0],
            group: parts[1] || ''
          };
        });
    }

    function startSorter() {
      const input = document.getElementById('bias-input').value;
      list = parseInput(input);

      if (list.length < 2) {
        alert('Por favor, ingresa al menos 2 nombres para comparar.');
        return;
      }

      battleCount = 0;
      const initialArrays = list.map(item => [item]);
      
      stateStack = [{
        arrays: initialArrays,
        merged: [],
        i: 0,
        j: 0,
        left: null,
        right: null
      }];

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';
      
      nextTurn();
    }

    function nextTurn() {
      if (stateStack.length === 0) return;

      let currentState = stateStack[stateStack.length - 1];

      if (currentState.arrays.length <= 1) {
        showResults(currentState.arrays[0] || []);
        return;
      }

      if (!currentState.left) {
        if (currentState.arrays.length >= 2) {
          currentState.left = currentState.arrays.shift();
          currentState.right = currentState.arrays.shift();
          currentState.i = 0;
          currentState.j = 0;
          currentState.merged = [];
        } else {
          let newLevelArrays = currentState.mergedSoFar || [];
          newLevelArrays.push(currentState.arrays.shift());
          stateStack.pop();
          stateStack.push({
            arrays: newLevelArrays,
            merged: [],
            i: 0,
            j: 0,
            left: null,
            right: null
          });
          nextTurn();
          return;
        }
      }

      battleCount++;
      document.getElementById('progress').innerText = `Enfrentamiento #${battleCount}`;

      const option0 = currentState.left[currentState.i];
      const option1 = currentState.right[currentState.j];

      document.getElementById('name-0').innerText = option0.name;
      document.getElementById('group-0').innerText = option0.group;

      document.getElementById('name-1').innerText = option1.name;
      document.getElementById('group-1').innerText = option1.group;
    }

    function pickWinner(selectedIndex) {
      let currentState = stateStack[stateStack.length - 1];

      if (selectedIndex === 0) {
        currentState.merged.push(currentState.left[currentState.i]);
        currentState.i++;
      } else {
        currentState.merged.push(currentState.right[currentState.j]);
        currentState.j++;
      }

      if (currentState.i >= currentState.left.length) {
        while (currentState.j < currentState.right.length) {
          currentState.merged.push(currentState.right[currentState.j]);
          currentState.j++;
        }
        finishPairMerge(currentState);
      } else if (currentState.j >= currentState.right.length) {
        while (currentState.i < currentState.left.length) {
          currentState.merged.push(currentState.left[currentState.i]);
          currentState.i++;
        }
        finishPairMerge(currentState);
      } else {
        nextTurn();
      }
    }

    function finishPairMerge(currentState) {
      if (!currentState.mergedSoFar) {
        currentState.mergedSoFar = [];
      }
      currentState.mergedSoFar.push(currentState.merged);
      
      currentState.left = null;
      currentState.right = null;

      if (currentState.arrays.length === 0) {
        const nextArrays = currentState.mergedSoFar;
        stateStack.pop();
        stateStack.push({
          arrays: nextArrays,
          merged: [],
          i: 0,
          j: 0,
          left: null,
          right: null
        });
      }

      nextTurn();
    }

    function showResults(finalList) {
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'block';

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      finalList.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td>${item.name}</td>
          <td>${item.group}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetSorter() {
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
    }
  </script>
</body>
</html>
