<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-pop Bias Sorter - ¡Arreglado!</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
      --glow: 0 0 20px rgba(236, 72, 153, 0.4);
      --text-color: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    p.description {
      color: var(--text-muted);
      text-align: center;
      max-width: 500px;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.4;
      padding: 0 10px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea:focus { outline: none; border-color: #ec4899; box-shadow: var(--glow); }

    button {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover { background: var(--accent-hover); transform: translateY(-2px); }

    .battle-area { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; }

    .progress-bar-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 5px;
    }

    .vs-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 10px; }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card:hover { border-color: #ec4899; box-shadow: var(--glow); background: rgba(30, 41, 59, 0.95); transform: translateY(-2px); }

    .card .name { font-size: 1.5rem; font-weight: 800; color: #fff; }

    .card .group { font-size: 1rem; color: #a78bfa; margin-top: 8px; font-weight: 600; }

    .vs-text { text-align: center; color: #ec4899; font-weight: 800; font-size: 1.3rem; margin: 5px 0; }

    .results-area { display: none; width: 100%; flex-direction: column; align-items: center; }

    .results-title {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 25px;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    table { width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden; table-layout: fixed; }

    th, td { padding: 16px 10px; text-align: left; }

    th { background: rgba(15, 23, 42, 0.9); color: #ec4899; font-size: 0.9rem; text-transform: uppercase; font-weight: 700; }

    tr { border-bottom: 1px solid rgba(255, 255, 255, 0.08); }

    tr:last-child { border-bottom: none; }

    tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }

    th.r1, td.rank { width: 15%; text-align: center; }
    th.r2, td.name-col { width: 45%; }
    th.r3, td.group-col { width: 40%; }

    td.rank { font-weight: 800; font-size: 1.3rem; color: #f472b6; }

    td.name-col { font-weight: 700; font-size: 1.2rem; color: #fff; }

    td.group-col { color: var(--text-muted); font-size: 1rem; }

    .btn-restart { margin-top: 30px; background: transparent; border: 2px solid #8b5cf6; color: #a78bfa; }
    .btn-restart:hover { background: var(--accent-gradient); color: white; border-color: transparent; }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter</h1>
  <p class="description">Sistema de Inserción Preciso: Ordena tu lista idol por idol de forma infalible.</p>

  <div class="container">
    <!-- Pantalla 1 -->
    <div id="setup-screen">
      <textarea id="bias-input" placeholder="Escribe un nombre por línea&#10;Ejemplo:&#10;Ireh - Purple Kiss&#10;Hwiseo - H1-KEY&#10;Dosie - Purple Kiss&#10;Yuki - Purple Kiss&#10;Chaein - Purple Kiss&#10;Swan - Purple Kiss&#10;Gaeun - Purple Kiss"></textarea>
      <button onclick="startSorter()">¡Comenzar Sorter!</button>
    </div>

    <!-- Pantalla 2 -->
    <div id="battle-screen" class="battle-area">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-info">
        <span id="progress-text">Ordenando idol 1 de 1</span>
        <span id="progress-pct">0%</span>
      </div>

      <div class="vs-container">
        <!-- Tarjeta 0 -->
        <div class="card" onclick="handleChoice(0)">
          <div id="idol-name-0" class="name"></div>
          <div id="idol-group-0" class="group"></div>
        </div>
        
        <div class="vs-text">VS</div>

        <!-- Tarjeta 1 -->
        <div class="card" onclick="handleChoice(1)">
          <div id="idol-name-1" class="name"></div>
          <div id="idol-group-1" class="group"></div>
        </div>
      </div>
    </div>

    <!-- Pantalla 3 -->
    <div id="results-screen" class="results-area">
      <h2 class="results-title">👑 Tu Ranking Perfecto 👑</h2>
      <table>
        <thead>
          <tr>
            <th class="r1">#</th>
            <th class="r2">Nombre</th>
            <th class="r3">Grupo</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button class="btn-restart" onclick="resetSorter()">Hacer otro Sorter</button>
    </div>
  </div>

  <script>
    let unSortedList = [];
    let sortedList = [];
    let currentIdolToInsert = null;
    let currentLow = 0;
    let currentHigh = 0;
    let currentMid = 0;

    function parseInput(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          const parts = line.split('-').map(p => p.trim());
          return { name: parts[0], group: parts[1] || '' };
        });
    }

    function startSorter() {
      const input = document.getElementById('bias-input').value;
      unSortedList = parseInput(input);

      if (unSortedList.length < 2) {
        alert('Por favor, ingresa al menos 2 integrantes.');
        return;
      }

      // Mezclar la lista inicial
      unSortedList.sort(() => Math.random() - 0.5);

      // Inicializar: la primera idol ya está "ordenada"
      sortedList = [unSortedList.shift()];
      
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';

      startInsertionOfNextIdol();
    }

    function startInsertionOfNextIdol() {
      if (unSortedList.length === 0) {
        showResults();
        return;
      }

      currentIdolToInsert = unSortedList.shift();
      currentLow = 0;
      currentHigh = sortedList.length - 1;

      updateProgress();
      showNextComparison();
    }

    function showNextComparison() {
      // Búsqueda binaria interactiva
      currentMid = Math.floor((currentLow + currentHigh) / 2);
      const idolSortedMid = sortedList[currentMid];

      // ¡AQUÍ ESTABA EL ERROR DE NOMBRES, YA CORREGIDO!
      // Tarjeta 0: Idol a insertar
      document.getElementById('idol-name-0').innerText = currentIdolToInsert.name;
      document.getElementById('idol-group-0').innerText = currentIdolToInsert.group;

      // Tarjeta 1: Idol ordenada media
      document.getElementById('idol-name-1').innerText = idolSortedMid.name;
      document.getElementById('idol-group-1').innerText = idolSortedMid.group;
    }

    function handleChoice(choice) {
      // choice 0 = Gana IdolToInsert (va arriba), choice 1 = Gana IdolSortedMid (va arriba)
      if (choice === 0) {
        // IdolToInsert es mejor, va a índices más bajos
        currentHigh = currentMid - 1;
      } else {
        // IdolSortedMid es mejor, IdolToInsert va a índices más altos
        currentLow = currentMid + 1;
      }

      if (currentLow > currentHigh) {
        // Posición encontrada
        sortedList.splice(currentLow, 0, currentIdolToInsert);
        startInsertionOfNextIdol();
      } else {
        // Continuar buscando para esta idol
        showNextComparison();
      }
    }

    function updateProgress() {
      const totalIdols = sortedList.length + unSortedList.length;
      const currentOrderedCount = sortedList.length;
      const pct = Math.round((currentOrderedCount / totalIdols) * 100);

      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `Posicionando idol ${currentOrderedCount} de ${totalIdols}`;
      document.getElementById('progress-pct').innerText = `${pct}%`;
    }

    function showResults() {
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'flex';

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      sortedList.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td class="name-col">${item.name}</td>
          <td class="group-col">${item.group}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetSorter() {
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
      unSortedList = [];
      sortedList = [];
    }
  </script>
</body>
</html>
