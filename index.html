<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-pop Bias Sorter</title>
  <!-- Librería canvas-confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(30, 41, 59, 0.8);
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
      --glow: 0 0 20px rgba(236, 72, 153, 0.4);
      --text-color: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    p.description {
      color: var(--text-muted);
      text-align: center;
      max-width: 500px;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.4;
      padding: 0 10px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .preset-section {
      width: 100%;
      margin-bottom: 15px;
    }

    .preset-label {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-bottom: 6px;
      font-weight: 600;
      display: block;
    }

    select.preset-select {
      width: 100%;
      padding: 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569;
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      cursor: pointer;
    }

    select.preset-select:focus { border-color: #ec4899; }

    .checkbox-container {
      width: 100%;
      max-height: 160px;
      overflow-y: auto;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #f8fafc;
      cursor: pointer;
    }

    .checkbox-item input {
      accent-color: #ec4899;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .btn-action-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      width: 100%;
    }

    .btn-secondary {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid #8b5cf6;
      color: #c4b5fd;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
      transition: background 0.2s;
    }

    .btn-secondary:hover { background: rgba(139, 92, 246, 0.4); color: white; }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea:focus { outline: none; border-color: #ec4899; box-shadow: var(--glow); }

    button.btn-main {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.btn-main:hover { background: var(--accent-hover); transform: translateY(-2px); }

    .battle-area { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; }

    .progress-bar-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      height: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 5px;
    }

    .vs-container { display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 5px; }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 25px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card:hover { border-color: #ec4899; box-shadow: var(--glow); background: rgba(30, 41, 59, 0.95); transform: translateY(-2px); }

    .card .name { font-size: 1.5rem; font-weight: 800; color: #fff; }

    .card .group { font-size: 1rem; color: #a78bfa; margin-top: 8px; font-weight: 600; }

    .vs-text { text-align: center; color: #ec4899; font-weight: 800; font-size: 1.3rem; margin: 3px 0; }

    /* Estilos para el botón de retroceso */
    .btn-undo {
      background: rgba(236, 72, 153, 0.15);
      border: 1px solid #ec4899;
      color: #f472b6;
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 5px;
    }
    .btn-undo:hover:not(:disabled) { background: rgba(236, 72, 153, 0.3); color: white; }
    .btn-undo:disabled { opacity: 0.4; border-color: #475569; color: #64748b; cursor: not-allowed; }

    .results-area { display: none; width: 100%; flex-direction: column; align-items: center; }

    .results-title {
      font-size: 1.8rem;
      text-align: center;
      margin-bottom: 25px;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    table { width: 100%; border-collapse: collapse; border-radius: 12px; overflow: hidden; table-layout: fixed; }

    th, td { padding: 16px 10px; text-align: left; }

    th { background: rgba(15, 23, 42, 0.9); color: #ec4899; font-size: 0.9rem; text-transform: uppercase; font-weight: 700; }

    tr { border-bottom: 1px solid rgba(255, 255, 255, 0.08); }

    tr:last-child { border-bottom: none; }

    tr:nth-child(even) { background: rgba(255, 255, 255, 0.03); }

    th.r1, td.rank { width: 18%; text-align: center; }
    th.r2, td.name-col { width: 42%; }
    th.r3, td.group-col { width: 40%; }

    td.rank { font-weight: 800; font-size: 1.2rem; color: #f472b6; text-align: center; }

    td.name-col { font-weight: 700; font-size: 1.1rem; color: #fff; }

    td.group-col { color: var(--text-muted); font-size: 0.95rem; }

    .btn-restart { margin-top: 30px; background: transparent; border: 2px solid #8b5cf6; color: #a78bfa; width: 100%; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 17px; cursor: pointer; }
    .btn-restart:hover { background: var(--accent-gradient); color: white; border-color: transparent; }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter</h1>
  <p class="description">Selecciona tus grupos, elige qué integrantes participan y arma tu ranking definitivo.</p>

  <div class="container">
    <!-- Pantalla 1 -->
    <div id="setup-screen" style="width: 100%;">
      
      <!-- Menú desplegable -->
      <div class="preset-section">
        <label class="preset-label">⚡ Seleccionar grupo para añadir:</label>
        <select id="preset-select" class="preset-select" onchange="mostrarSelectorIntegrantes()">
          <option value="">-- Elige un grupo --</option>
        </select>
      </div>

      <!-- Panel de selección de integrantes individuales -->
      <div id="checkbox-panel" class="checkbox-container"></div>

      <div id="panel-actions" class="btn-action-group" style="display: none;">
        <button class="btn-secondary" onclick="agregarSeleccionadasAlTextarea()">➕ Añadir seleccionadas</button>
        <button class="btn-secondary" style="border-color: #f43362; color: #fda4af;" onclick="cerrarPanelIntegrantes()">Cancelar</button>
      </div>

      <textarea id="bias-input" placeholder="O escribe/pega tus integrantes aquí (una por línea)&#10;Ej: Na Go-eun - Purple Kiss"></textarea>
      
      <button class="btn-main" onclick="startSorter()">¡Comenzar Sorter!</button>
    </div>

    <!-- Pantalla 2 -->
    <div id="battle-screen" class="battle-area">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-info">
        <span id="progress-text">Ordenando idol 1 de 1</span>
        <span id="progress-pct">0%</span>
      </div>

      <div class="vs-container">
        <!-- Tarjeta 0 -->
        <div class="card" onclick="handleChoice(0)">
          <div id="idol-name-0" class="name"></div>
          <div id="idol-group-0" class="group"></div>
        </div>
        
        <div class="vs-text">VS</div>

        <!-- Tarjeta 1 -->
        <div class="card" onclick="handleChoice(1)">
          <div id="idol-name-1" class="name"></div>
          <div id="idol-group-1" class="group"></div>
        </div>

        <!-- Botón Volver Atrás -->
        <button id="btn-undo" class="btn-undo" onclick="undoLastChoice()" disabled>↩️ Volver atrás (3 disponibles)</button>
      </div>
    </div>

    <!-- Pantalla 3 -->
    <div id="results-screen" class="results-area">
      <h2 class="results-title">👑 Tu Ranking Definitivo 👑</h2>
      <table>
        <thead>
          <tr>
            <th class="r1">#</th>
            <th class="r2">Nombre</th>
            <th class="r3">Grupo</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button class="btn-restart" onclick="resetSorter()">Hacer otro Sorter</button>
    </div>
  </div>

    // Poblar el menú desplegable ordenado alfabéticamente
    window.onload = function() {
      const select = document.getElementById('preset-select');
      const gruposOrdenados = Object.keys(misGruposGuardados).sort();
      
      gruposOrdenados.forEach(nombreGrupo => {
        let opt = document.createElement('option');
        opt.value = nombreGrupo;
        opt.innerText = nombreGrupo;
        select.appendChild(opt);
      });
    };

    function mostrarSelectorIntegrantes() {
      const select = document.getElementById('preset-select');
      const grupo = select.value;
      const panel = document.getElementById('checkbox-panel');
      const actions = document.getElementById('panel-actions');

      if (!grupo) {
        panel.style.display = 'none';
        actions.style.display = 'none';
        return;
      }

      panel.innerHTML = '';
      misGruposGuardados[grupo].forEach((integrante) => {
        const div = document.createElement('label');
        div.className = 'checkbox-item';
        div.innerHTML = `<input type="checkbox" value="${integrante}" checked> ${integrante}`;
        panel.appendChild(div);
      });

      panel.style.display = 'flex';
      actions.style.display = 'flex';
    }

    function agregarSeleccionadasAlTextarea() {
      const checkboxes = document.querySelectorAll('#checkbox-panel input[type="checkbox"]:checked');
      const input = document.getElementById('bias-input');
      
      let nuevasLineas = [];
      checkboxes.forEach(cb => nuevasLineas.push(cb.value));

      if (nuevasLineas.length > 0) {
        let textoActual = input.value.trim();
        if (textoActual.length > 0) {
          input.value = textoActual + '\n' + nuevasLineas.join('\n');
        } else {
          input.value = nuevasLineas.join('\n');
        }
      }

      cerrarPanelIntegrantes();
    }

    function cerrarPanelIntegrantes() {
      document.getElementById('checkbox-panel').style.display = 'none';
      document.getElementById('panel-actions').style.display = 'none';
      document.getElementById('preset-select').value = '';
    }

    /* ==============================================================================
       LÓGICA DEL SORTER CON HISTORIAL (UNDO)
       ============================================================================== */
    let unSortedList = [];
    let sortedList = [];
    let currentIdolToInsert = null;
    let currentLow = 0;
    let currentHigh = 0;
    let currentMid = 0;
    
    // Variables para el historial de retroceso
    let historyStack = [];
    const maxUndos = 3;
    let remainingUndos = maxUndos;

    function parseInput(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          const parts = line.split('-').map(p => p.trim());
          return { name: parts[0], group: parts[1] || '' };
        });
    }

    function startSorter() {
      const input = document.getElementById('bias-input').value;
      unSortedList = parseInput(input);

      if (unSortedList.length < 2) {
        alert('Por favor, selecciona o ingresa al menos 2 integrantes.');
        return;
      }

      unSortedList.sort(() => Math.random() - 0.5);

      sortedList = [unSortedList.shift()];
      historyStack = [];
      remainingUndos = maxUndos;
      updateUndoButton();
      
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';

      startInsertionOfNextIdol();
    }

    function startInsertionOfNextIdol() {
      if (unSortedList.length === 0) {
        showResults();
        return;
      }

      currentIdolToInsert = unSortedList.shift();
      currentLow = 0;
      currentHigh = sortedList.length - 1;

      updateProgress();
      showNextComparison();
    }

    function showNextComparison() {
      currentMid = Math.floor((currentLow + currentHigh) / 2);
      const idolSortedMid = sortedList[currentMid];

      document.getElementById('idol-name-0').innerText = currentIdolToInsert.name;
      document.getElementById('idol-group-0').innerText = currentIdolToInsert.group;

      document.getElementById('idol-name-1').innerText = idolSortedMid.name;
      document.getElementById('idol-group-1').innerText = idolSortedMid.group;
    }

    function handleChoice(choice) {
      // Guardar estado actual en el historial antes de avanzar
      historyStack.push({
        unSortedList: JSON.parse(JSON.stringify(unSortedList)),
        sortedList: JSON.parse(JSON.stringify(sortedList)),
        currentIdolToInsert: JSON.parse(JSON.stringify(currentIdolToInsert)),
        currentLow: currentLow,
        currentHigh: currentHigh,
        currentMid: currentMid
      });

      // Si el historial supera un tamaño razonable, limpiamos los más viejos, pero controlamos el límite de 3 permitidos del usuario con `remainingUndos`
      if (historyStack.length > 20) historyStack.shift();

      if (choice === 0) {
        currentHigh = currentMid - 1;
      } else {
        currentLow = currentMid + 1;
      }

      if (currentLow > currentHigh) {
        sortedList.splice(currentLow, 0, currentIdolToInsert);
        startInsertionOfNextIdol();
      } else {
        showNextComparison();
      }

      updateUndoButton();
    }

    function undoLastChoice() {
      if (historyStack.length === 0 || remainingUndos <= 0) return;

      const prevState = historyStack.pop();
      unSortedList = prevState.unSortedList;
      sortedList = prevState.sortedList;
      currentIdolToInsert = prevState.currentIdolToInsert;
      currentLow = prevState.currentLow;
      currentHigh = prevState.currentHigh;
      currentMid = prevState.currentMid;

      remainingUndos--;
      updateProgress();
      showNextComparison();
      updateUndoButton();
    }

    function updateUndoButton() {
      const btn = document.getElementById('btn-undo');
      if (historyStack.length > 0 && remainingUndos > 0) {
        btn.disabled = false;
        btn.innerText = `↩️ Volver atrás (${remainingUndos} ${remainingUndos === 1 ? 'restante' : 'restantes'})`;
      } else {
        btn.disabled = true;
        btn.innerText = remainingUndos === 0 ? '↩️ Sin retrocesos disponibles' : '↩️ Volver atrás';
      }
    }

    function updateProgress() {
      const totalIdols = sortedList.length + unSortedList.length + (currentIdolToInsert ? 1 : 0);
      const currentOrderedCount = sortedList.length;
      const pct = Math.min(100, Math.round((currentOrderedCount / totalIdols) * 100));

      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `Posicionando idol ${currentOrderedCount + 1} de ${totalIdols}`;
      document.getElementById('progress-pct').innerText = `${pct}%`;
    }
