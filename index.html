<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>K-pop Bias Sorter - Liga</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(30, 41, 59, 0.75);
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
      --glow: 0 0 20px rgba(236, 72, 153, 0.4);
      --text-color: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      width: 100%;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    p.description {
      color: var(--text-muted);
      text-align: center;
      max-width: 500px;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.4;
      padding: 0 10px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px 15px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    textarea {
      width: 100%;
      height: 200px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      resize: vertical;
      font-family: inherit;
      font-size: 15px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: var(--glow);
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: all 0.25s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
    }

    /* Batalla */
    .battle-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }

    .progress-bar-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.3s ease;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .vs-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-top: 5px;
    }

    .card {
      width: 100%;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 22px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .card:hover {
      border-color: #ec4899;
      box-shadow: var(--glow);
      background: rgba(30, 41, 59, 0.95);
      transform: translateY(-2px);
    }

    .card .name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .card .group {
      font-size: 0.95rem;
      color: #a78bfa;
      margin-top: 6px;
      font-weight: 600;
    }

    .vs-text {
      text-align: center;
      color: #ec4899;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 2px;
    }

    .btn-tie {
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid #64748b;
      color: #cbd5e1;
      padding: 12px;
      font-size: 14px;
      margin-top: 5px;
    }
    .btn-tie:hover {
      background: rgba(71, 85, 105, 0.8);
      color: #fff;
    }

    /* Resultados */
    .results-area {
      display: none;
      width: 100%;
    }

    .results-title {
      font-size: 1.7rem;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 5px;
      border-radius: 12px;
      overflow: hidden;
      table-layout: fixed;
    }

    th, td {
      padding: 14px 8px;
      text-align: left;
      word-wrap: break-word;
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: #ec4899;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
    }

    tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    tr:last-child {
      border-bottom: none;
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.03);
    }

    th.r1, td.rank { width: 15%; text-align: center; }
    th.r2, td.name-col { width: 45%; }
    th.r3, td.group-col { width: 40%; }

    td.rank {
      font-weight: 800;
      font-size: 1.2rem;
      color: #f472b6;
    }

    td.name-col {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    td.group-col {
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .btn-restart {
      margin-top: 25px;
      background: transparent;
      border: 2px solid #8b5cf6;
      color: #a78bfa;
      padding: 15px;
    }

    .btn-restart:hover {
      background: var(--accent-gradient);
      color: white;
      border-color: transparent;
    }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter</h1>
  <p class="description">Sistema de Liga: Enfrentamientos aleatorios inteligentes para posicionar a todas las integrantes.</p>

  <div class="container">
    <!-- Pantalla 1 -->
    <div id="setup-screen">
      <textarea id="bias-input" placeholder="Escribe un nombre por línea&#10;Ejemplo:&#10;Ireh - Purple Kiss&#10;Hwiseo - H1-KEY&#10;Dosie - Purple Kiss&#10;Yuki - Purple Kiss&#10;Chaein - Purple Kiss&#10;Swan - Purple Kiss&#10;Gaeun - Purple Kiss"></textarea>
      <button onclick="startSorter()">¡Iniciar Liga!</button>
    </div>

    <!-- Pantalla 2 -->
    <div id="battle-screen" class="battle-area">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="progress-info">
        <span id="progress-text">Batalla 1 / 1</span>
        <span id="progress-pct">0%</span>
      </div>

      <div class="vs-container">
        <div class="card" onclick="handleChoice(0)">
          <div id="name-0" class="name"></div>
          <div id="group-0" class="group"></div>
        </div>
        
        <div class="vs-text">VS</div>

        <div class="card" onclick="handleChoice(1)">
          <div id="name-1" class="name"></div>
          <div id="group-1" class="group"></div>
        </div>
      </div>

      <button class="btn-tie" onclick="handleChoice('tie')">Empate / No me decido 🤝</button>
    </div>

    <!-- Pantalla 3 -->
    <div id="results-screen" class="results-area">
      <h2 class="results-title">👑 Tu Ranking Definitivo 👑</h2>
      <table>
        <thead>
          <tr>
            <th class="r1">#</th>
            <th class="r2">Nombre</th>
            <th class="r3">Grupo</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button class="btn-restart" onclick="resetSorter()">Hacer otro Sorter</button>
    </div>
  </div>

  <script>
    let participants = [];
    let matchups = [];
    let currentMatchIndex = 0;
    let totalMatchesNeeded = 0;

    function parseInput(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map((line, index) => {
          const parts = line.split('-').map(p => p.trim());
          return {
            id: index,
            name: parts[0],
            group: parts[1] || '',
            score: 1000, // Sistema estilo Elo inicial
            matches: 0
          };
        });
    }

    function generateMatchups(list) {
      let pairs = [];
      // Generar combinaciones inteligentes de enfrentamientos cruzados (sistema de liga)
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          pairs.push([i, j]);
        }
      }
      // Mezclar aleatoriamente los duelos
      return pairs.sort(() => Math.random() - 0.5);
    }

    function startSorter() {
      const input = document.getElementById('bias-input').value;
      participants = parseInput(input);

      if (participants.length < 2) {
        alert('Por favor, ingresa al menos 2 integrantes.');
        return;
      }

      matchups = generateMatchups(participants);
      
      // Limitamos los duelos si la lista es enorme (ej: más de 24 miembros = 276 duelos es mucho), 
      // tomando una muestra óptima para que no se haga eterno, o haciendo todos si son pocos.
      if (participants.length <= 15) {
        totalMatchesNeeded = matchups.length; // Todos contra todos exactos
      } else {
        // Para listas grandes (como 24 de tripleS), limitamos a una cantidad justa y representativa (ej: 4-5 duelos por idol)
        let maxCap = participants.length * 3;
        if (matchups.length > maxCap) {
          matchups = matchups.slice(0, maxCap);
        }
        totalMatchesNeeded = matchups.length;
      }

      currentMatchIndex = 0;

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';

      showCurrentMatch();
    }

    function showCurrentMatch() {
      if (currentMatchIndex >= matchups.length) {
        showResults();
        return;
      }

      const [idxA, idxB] = matchups[currentMatchIndex];
      const memberA = participants.find(p => p.id === idxA);
      const memberB = participants.find(p => p.id === idxB);

      document.getElementById('name-0').innerText = memberA.name;
      document.getElementById('group-0').innerText = memberA.group;

      document.getElementById('name-1').innerText = memberB.name;
      document.getElementById('group-1').innerText = memberB.group;

      // Actualizar barra de progreso real
      let currentNum = currentMatchIndex + 1;
      let pct = Math.round((currentNum / totalMatchesNeeded) * 100);
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `Duelo ${currentNum} de ${totalMatchesNeeded}`;
      document.getElementById('progress-pct').innerText = `${pct}%`;
    }

    function handleChoice(choice) {
      const [idxA, idxB] = matchups[currentMatchIndex];
      let memberA = participants.find(p => p.id === idxA);
      let memberB = participants.find(p => p.id === idxB);

      // Ponderación de puntos estilo sistema competitivo/Elo
      if (choice === 0) {
        memberA.score += 35;
        memberB.score -= 15;
      } else if (choice === 1) {
        memberB.score += 35;
        memberA.score -= 15;
      } else {
        // Empate: reparto equitativo menor
        memberA.score += 10;
        memberB.score += 10;
      }

      currentMatchIndex++;
      showCurrentMatch();
    }

    function showResults() {
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'flex';

      // Ordenar de mayor a menor puntaje final
      participants.sort((a, b) => b.score - a.score);

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      participants.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td class="name-col">${item.name}</td>
          <td class="group-col">${item.group}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetSorter() {
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
    }
  </script>
</body>
</html>
