<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Bias Sorter 1v1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-gradient: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
      --accent-hover: linear-gradient(135deg, #db2777 0%, #7c3aed 100%);
      --glow: 0 0 20px rgba(236, 72, 153, 0.4);
      --text-color: #f8fafc;
      --text-muted: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-color);
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 8px;
      margin-top: 10px;
    }

    p.description {
      color: var(--text-muted);
      text-align: center;
      max-width: 500px;
      font-size: 0.95rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .container {
      width: 100%;
      max-width: 550px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    textarea {
      width: 100%;
      height: 220px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      resize: vertical;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea:focus {
      outline: none;
      border-color: #ec4899;
      box-shadow: var(--glow);
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--accent-gradient);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
      transition: all 0.25s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
    }

    /* Batalla 1v1 */
    .battle-area {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .progress-bar-container {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      height: 10px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .vs-container {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .card {
      flex: 1;
      background: rgba(15, 23, 42, 0.85);
      border: 2px solid #334155;
      border-radius: 16px;
      padding: 30px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 140px;
    }

    .card:hover {
      border-color: #ec4899;
      transform: translateY(-4px);
      box-shadow: var(--glow);
      background: rgba(30, 41, 59, 0.95);
    }

    .card .name {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .card .group {
      font-size: 0.85rem;
      color: #a78bfa;
      margin-top: 6px;
      font-weight: 600;
    }

    /* Resultados */
    .results-area {
      display: none;
    }

    .results-title {
      font-size: 1.5rem;
      text-align: center;
      margin-bottom: 20px;
      background: linear-gradient(to right, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
    }

    th {
      background: rgba(15, 23, 42, 0.9);
      color: #ec4899;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }

    td.rank {
      font-weight: 800;
      width: 45px;
      color: #f472b6;
    }

    td.name-col {
      font-weight: 700;
    }

    td.group-col {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .btn-restart {
      margin-top: 25px;
      background: transparent;
      border: 2px solid #8b5cf6;
      color: #a78bfa;
    }

    .btn-restart:hover {
      background: var(--accent-gradient);
      color: white;
      border-color: transparent;
    }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter 1v1</h1>
  <p class="description">Armá tu propio ranking seleccionando tu preferida en cada duelo 1v1.</p>

  <div class="container">
    <!-- Pantalla 1: Formulario -->
    <div id="setup-screen">
      <textarea id="bias-input" placeholder="Escribe un nombre por línea&#10;Ejemplo:&#10;Ireh - Purple Kiss&#10;Dosie - Purple Kiss&#10;Yuki - Purple Kiss&#10;Chaein - Purple Kiss&#10;Swan - Purple Kiss&#10;Gaeun - Purple Kiss"></textarea>
      <button onclick="startSorter()">¡Comenzar Enfrentamientos!</button>
    </div>

    <!-- Pantalla 2: Batalla 1v1 -->
    <div id="battle-screen" class="battle-area">
      <div class="progress-bar-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="progress" class="progress-text">Enfrentamiento #1</div>

      <div class="vs-container">
        <div class="card" onclick="pickWinner(0)">
          <div id="name-0" class="name"></div>
          <div id="group-0" class="group"></div>
        </div>
        <div class="card" onclick="pickWinner(1)">
          <div id="name-1" class="name"></div>
          <div id="group-1" class="group"></div>
        </div>
      </div>
    </div>

    <!-- Pantalla 3: Resultados -->
    <div id="results-screen" class="results-area">
      <h2 class="results-title">👑 Tu Ranking Final 👑</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Grupo</th>
          </tr>
        </thead>
        <tbody id="results-body"></tbody>
      </table>
      <button class="btn-restart" onclick="resetSorter()">Crear otro Sorter</button>
    </div>
  </div>

  <script>
    let list = [];
    let state = null;
    let battleCount = 0;
    let totalEstimatedBattles = 0;

    function parseInput(text) {
      return text.split('\n')
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {
          const parts = line.split('-').map(p => p.trim());
          return {
            name: parts[0],
            group: parts[1] || ''
          };
        });
    }

    function startSorter() {
      const input = document.getElementById('bias-input').value;
      list = parseInput(input);

      if (list.length < 2) {
        alert('Por favor, ingresa al menos 2 integrantes para comparar.');
        return;
      }

      battleCount = 0;
      totalEstimatedBattles = Math.ceil(list.length * Math.log2(list.length));

      // Inicialización del Merge Sort interactivo por niveles
      state = {
        level: list.map(item => [item]),
        nextLevel: [],
        left: null,
        right: null,
        merged: [],
        i: 0,
        j: 0
      };

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'flex';
      
      setupNextPair();
    }

    function setupNextPair() {
      // Si solo queda 1 sub-lista en la ronda actual y no hay nada en procesar
      if (state.level.length === 1 && !state.left) {
        showResults(state.level[0]);
        return;
      }

      // Si terminamos una ronda completa, pasamos a la siguiente ronda
      if (state.level.length === 0 && !state.left) {
        state.level = state.nextLevel;
        state.nextLevel = [];
        setupNextPair();
        return;
      }

      // Si no hay un par cargado actualmente, tomar los próximos 2 sub-arrays
      if (!state.left) {
        if (state.level.length >= 2) {
          state.left = state.level.shift();
          state.right = state.level.shift();
          state.merged = [];
          state.i = 0;
          state.j = 0;
        } else if (state.level.length === 1) {
          // Elemento impar que pasa directamente a la siguiente ronda
          state.nextLevel.push(state.level.shift());
          setupNextPair();
          return;
        }
      }

      // Mostrar la batalla en pantalla
      battleCount++;
      document.getElementById('progress').innerText = `Enfrentamiento #${battleCount}`;
      
      let pct = Math.min(Math.round((battleCount / totalEstimatedBattles) * 100), 95);
      document.getElementById('progress-bar').style.width = `${pct}%`;

      const itemA = state.left[state.i];
      const itemB = state.right[state.j];

      document.getElementById('name-0').innerText = itemA.name;
      document.getElementById('group-0').innerText = itemA.group;

      document.getElementById('name-1').innerText = itemB.name;
      document.getElementById('group-1').innerText = itemB.group;
    }

    function pickWinner(selectedIndex) {
      if (selectedIndex === 0) {
        state.merged.push(state.left[state.i]);
        state.i++;
      } else {
        state.merged.push(state.right[state.j]);
        state.j++;
      }

      // Si alguno de los dos sub-grupos ya se terminó, volcar el resto
      if (state.i >= state.left.length) {
        while (state.j < state.right.length) {
          state.merged.push(state.right[state.j]);
          state.j++;
        }
        finishCurrentMerge();
      } else if (state.j >= state.right.length) {
        while (state.i < state.left.length) {
          state.merged.push(state.left[state.i]);
          state.i++;
        }
        finishCurrentMerge();
      } else {
        setupNextPair();
      }
    }

    function finishCurrentMerge() {
      state.nextLevel.push(state.merged);
      state.left = null;
      state.right = null;
      state.merged = [];
      setupNextPair();
    }

    function showResults(finalList) {
      document.getElementById('progress-bar').style.width = '100%';
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'block';

      const tbody = document.getElementById('results-body');
      tbody.innerHTML = '';

      finalList.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="rank">${index + 1}</td>
          <td class="name-col">${item.name}</td>
          <td class="group-col">${item.group}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function resetSorter() {
      document.getElementById('results-screen').style.display = 'none';
      document.getElementById('setup-screen').style.display = 'block';
      document.getElementById('progress-bar').style.width = '0%';
    }
  </script>
</body>
</html>
