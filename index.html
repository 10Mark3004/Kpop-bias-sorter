<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Bias Sorter Sencillo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    textarea {
      width: 100%;
      height: 150px;
      background: #0f172a;
      color: #fff;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
      margin-bottom: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #ec4899;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #db2777; }
    .card {
      background: #334155;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
      font-size: 20px;
      font-weight: bold;
    }
    .card:hover { background: #475569; border: 2px solid #ec4899; }
    #battle-screen, #results-screen { display: none; }
    ol { padding-left: 20px; }
    li { margin: 5px 0; }
  </style>
</head>
<body>

  <h1>K-pop Bias Sorter</h1>

  <div class="container">
    <!-- PANTALLA 1: CARGA -->
    <div id="setup-screen">
      <p>Escribí o pegá tus integrantes (Formato: <b>Nombre - Grupo</b>):</p>
      <textarea id="input-data">Jisoo - BLACKPINK
Jennie - BLACKPINK
Nayeon - TWICE
Sana - TWICE
Karina - aespa
Winter - aespa</textarea>
      <button onclick="comenzar()">¡Comenzar Sorter!</button>
    </div>

    <!-- PANTALLA 2: BATALLA -->
    <div id="battle-screen">
      <p id="progreso" style="text-align: center; color: #94a3b8;"></p>
      <p style="text-align: center; font-weight: bold; margin-bottom: 5px;">¿Quién te gusta más?</p>
      
      <div class="card" id="btn-0" onclick="elegir(0)"></div>
      <div style="text-align: center; font-weight: bold; color: #ec4899;">VS</div>
      <div class="card" id="btn-1" onclick="elegir(1)"></div>
    </div>

    <!-- PANTALLA 3: RESULTADOS -->
    <div id="results-screen">
      <h2>👑 Tu Ranking Definitivo 👑</h2>
      <ol id="lista-resultados"></ol>
      <button onclick="location.reload()" style="margin-top: 15px;">Hacer otro</button>
    </div>
  </div>

  <script>
    let pendientes = [];
    let ordenados = [];
    let actual = null;
    let low = 0, high = 0, mid = 0;

    function comenzar() {
      let texto = document.getElementById('input-data').value.trim();
      let lineas = texto.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      if (lineas.length < 2) {
        alert("Meté al menos 2 líneas.");
        return;
      }

      // Convertir a objetos {name, group}
      pendientes = lineas.map(l => {
        let partes = l.split('-');
        return { name: partes[0].trim(), group: partes[1] ? partes.trim() : '' };
      });

      // Mezclar aleatoriamente
      pendientes.sort(() => Math.random() - 0.5);

      // Iniciar con el primero ordenado
      ordenados = [pendientes.shift()];

      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('battle-screen').style.display = 'block';

      siguienteSiguiente();
    }

    function siguienteSiguiente() {
      if (pendientes.length === 0) {
        mostrarResultados();
        return;
      }

      actual = pendientes.shift();
      low = 0;
      high = ordenados.length - 1;

      actualizarProgreso();
      mostrarBatalla();
    }

    function mostrarBatalla() {
      mid = Math.floor((low + high) / 2);
      let op = ordenados[mid];

      // Mostramos en los botones el idol actual vs el del medio del ranking ordenado
      document.getElementById('btn-0').innerText = `${actual.name} (${actual.group})`;
      document.getElementById('btn-1').innerText = `${op.name} (${op.group})`;
    }

    function elegir(opcion) {
      // Si elige 0, significa que 'actual' es mejor que 'op', buscamos hacia la izquierda
      if (opcion === 0) {
        high = mid - 1;
      } else {
        // Si elige 1, 'op' es mejor, buscamos hacia la derecha
        low = mid + 1;
      }

      if (low > high) {
        ordenados.splice(low, 0, actual);
        siguienteSiguiente();
      } else {
        mostrarBatalla();
      }
    }

    function actualizarProgreso() {
      let total = ordenados.length + pendientes.length;
      let actualNum = ordenados.length;
      document.getElementById('progreso').innerText = `Posicionando idol ${actualNum} de ${total}`;
    }

    function mostrarResultados() {
      document.getElementById('battle-screen').style.display = 'none';
      document.getElementById('results-screen').style.display = 'block';

      let listaHTML = '';
      ordenados.forEach((item, index) => {
        listaHTML += `<li><b>${item.name}</b> (${item.group})</li>`;
      });
      document.getElementById('lista-resultados').innerHTML = listaHTML;
    }
  </script>
</body>
</html>
