<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-pop Bias Sorter - Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #0d0d16 0%, #15102a 100%);
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Contenedor de logos de fondo */
    #background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .bg-logo {
      position: absolute;
      max-width: 130px;
      max-height: 65px;
      object-fit: contain;
      opacity: 0;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.2));
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
      transform: scale(0.85);
    }

    .bg-logo.centered-logo {
      transform: translateX(-50%) scale(0.85);
    }

    .bg-logo.visible {
      opacity: 0.4;
      transform: scale(1);
    }

    .bg-logo.centered-logo.visible {
      transform: translateX(-50%) scale(1);
    }

    /* Pantallas */
    .screen {
      position: relative;
      z-index: 2;
      text-align: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .hidden {
      display: none !important;
    }

    /* Pantalla 1: Bienvenida */
    .welcome-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      max-width: 90%;
      width: 350px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 2rem;
      background: linear-gradient(135deg, #ff7eb3, #7afcff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.8rem;
    }

    p {
      color: #b3b3cb;
      font-size: 0.95rem;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .btn-main {
      display: inline-block;
      width: 100%;
      padding: 14px 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #e91e63, #9c27b0);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(233, 30, 99, 0.6);
    }

    /* Pantalla 2: Simulación Juego */
    .sorter-card {
      background: rgba(23, 22, 38, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .vs-box {
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 10px;
      margin: 10px 0;
      font-weight: bold;
    }

    .btn-back {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #aaa;
      padding: 8px 16px;
      border-radius: 8px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div id="background-container"></div>

  <!-- PANTALLA 1: BIENVENIDA -->
  <div id="screen-welcome" class="screen">
    <div class="welcome-card">
      <h1>¡Bienvenido!</h1>
      <p>Selecciona tus grupos e integrantes favoritos para armar tu ranking definitivo.</p>
      <button class="btn-main" onclick="goToGame()">¡Probar Sorter!</button>
    </div>
  </div>

  <!-- PANTALLA 2: SIMULACIÓN JUEGO -->
  <div id="screen-game" class="screen hidden">
    <div class="sorter-card">
      <h2 style="font-size: 1.2rem; margin-bottom: 10px;">Enfrentamiento VS</h2>
      <div class="vs-box">Integrante A</div>
      <span style="color: #ff7eb3; font-weight: bold;">VS</span>
      <div class="vs-box">Integrante B</div>
      <button class="btn-back" onclick="goToWelcome()">← Volver a Bienvenida</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ PANEL DE CONTROL DE POSICIONES
    // Si querés subir o bajar zonas, ¡cambiá SOLO los % acá!
    // ==========================================
    const POSICIONES = {
      // Para la pantalla de bienvenida
      arribaIzquierda: { top: '7%', left: '6%' },
      arribaDerecha:   { top: '7%', right: '6%' },
      arribaCentro:    { top: '22%', left: '50%', isCenter: true },
      abajoCentro:     { bottom: '26%', left: '50%', isCenter: true }, // <-- SUBÍ ESTE
      abajoIzquierda:  { bottom: '14%', left: '8%' },                   // <-- SUBÍ ESTE
      abajoDerecha:    { bottom: '14%', right: '8%' },                  // <-- SUBÍ ESTE

      // Para el juego
      juegoIzquierda:  { bottom: '14%', left: '8%' },                   // <-- SUBÍ ESTE
      juegoCentro:     { bottom: '24%', left: '50%', isCenter: true }, // <-- SUBÍ ESTE
      juegoDerecha:    { bottom: '14%', right: '8%' }                   // <-- SUBÍ ESTE
    };

    // 1. BIENVENIDA (Usa las posiciones definidas arriba)
    const welcomeBatches = [
      [
        { src: 'logos/PurpleKiss.png', pos: POSICIONES.arribaIzquierda },
        { src: 'logos/Aespa.png',      pos: POSICIONES.arribaDerecha },
        { src: 'logos/Kiiikiii.png',   pos: POSICIONES.arribaCentro },
        { src: 'logos/Gfriend.png',    pos: POSICIONES.abajoCentro },
        { src: 'logos/Itzy.png',       pos: POSICIONES.abajoIzquierda },
        { src: 'logos/Fiftyfifty.png', pos: POSICIONES.abajoDerecha }
      ],
      [
        { src: 'logos/2NE1.png',       pos: POSICIONES.arribaIzquierda },
        { src: 'logos/Nmixx.png',      pos: POSICIONES.arribaDerecha },
        { src: 'logos/Lesserafim.png', pos: POSICIONES.arribaCentro },
        { src: 'logos/Youngposse.png', pos: POSICIONES.abajoCentro },
        { src: 'logos/StayC.png',      pos: POSICIONES.abajoIzquierda },
        { src: 'logos/Newjeans.png',   pos: POSICIONES.abajoDerecha }
      ],
      [
        { src: 'logos/ARTMS.png',      pos: POSICIONES.arribaIzquierda },
        { src: 'logos/Twice.png',      pos: POSICIONES.arribaDerecha },
        { src: 'logos/Oddyouth.png',   pos: POSICIONES.arribaCentro },
        { src: 'logos/Mamamoo.png',    pos: POSICIONES.abajoCentro },
        { src: 'logos/Illit.png',      pos: POSICIONES.abajoIzquierda },
        { src: 'logos/Chuu.png',       pos: POSICIONES.abajoDerecha }
      ],
      [
        { src: 'logos/Blackpink.png',  pos: POSICIONES.arribaIzquierda },
        { src: 'logos/Atheart.png',    pos: POSICIONES.arribaDerecha },
        { src: 'logos/Viviz.png',      pos: POSICIONES.arribaCentro },
        { src: 'logos/Rescene.png',    pos: POSICIONES.abajoCentro },
        { src: 'logos/TripleS.png',    pos: POSICIONES.abajoIzquierda },
        { src: 'logos/Bibi.png',       pos: POSICIONES.abajoDerecha }
      ],
      [
        { src: 'logos/Izna.png',       pos: POSICIONES.arribaIzquierda },
        { src: 'logos/Loossemble.png', pos: POSICIONES.arribaDerecha },
        { src: 'logos/Ive.png',        pos: POSICIONES.arribaCentro },
        { src: 'logos/Billie.png',     pos: POSICIONES.abajoCentro },
        { src: 'logos/Everglow.png',   pos: POSICIONES.abajoIzquierda },
        { src: 'logos/Ifeye.png',      pos: POSICIONES.abajoDerecha }
      ]
    ];

    // 2. JUEGO (Usa las posiciones de abajo definidas arriba)
    const gameBatches = [
      [
        { src: 'logos/PurpleKiss.png', pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Aespa.png',      pos: POSICIONES.juegoCentro },
        { src: 'logos/Fiftyfifty.png', pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Twice.png',      pos: POSICIONES.juegoIzquierda },
        { src: 'logos/StayC.png',      pos: POSICIONES.juegoCentro },
        { src: 'logos/Itzy.png',       pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Blackpink.png',  pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Newjeans.png',   pos: POSICIONES.juegoCentro },
        { src: 'logos/Kiiikiii.png',   pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Lesserafim.png', pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Nmixx.png',      pos: POSICIONES.juegoCentro },
        { src: 'logos/Gfriend.png',    pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Ive.png',        pos: POSICIONES.juegoIzquierda },
        { src: 'logos/2NE1.png',       pos: POSICIONES.juegoCentro },
        { src: 'logos/Youngposse.png', pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/ARTMS.png',      pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Oddyouth.png',   pos: POSICIONES.juegoCentro },
        { src: 'logos/Mamamoo.png',    pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Illit.png',      pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Chuu.png',       pos: POSICIONES.juegoCentro },
        { src: 'logos/Atheart.png',    pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Viviz.png',      pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Rescene.png',    pos: POSICIONES.juegoCentro },
        { src: 'logos/TripleS.png',    pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Bibi.png',       pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Izna.png',       pos: POSICIONES.juegoCentro },
        { src: 'logos/Loossemble.png', pos: POSICIONES.juegoDerecha }
      ],
      [
        { src: 'logos/Billie.png',     pos: POSICIONES.juegoIzquierda },
        { src: 'logos/Everglow.png',   pos: POSICIONES.juegoCentro },
        { src: 'logos/Ifeye.png',      pos: POSICIONES.juegoDerecha }
      ]
    ];

    let currentBatchIndex = 0;
    let currentMode = 'welcome';
    let intervalId = null;
    const container = document.getElementById('background-container');

    function showNextLogoBatch() {
      const activeBatches = currentMode === 'welcome' ? welcomeBatches : gameBatches;

      const currentLogos = container.querySelectorAll('.bg-logo');
      currentLogos.forEach(img => img.classList.remove('visible'));

      setTimeout(() => {
        container.innerHTML = '';
        const currentBatch = activeBatches[currentBatchIndex];

        currentBatch.forEach(data => {
          const img = document.createElement('img');
          img.src = data.src;
          
          const p = data.pos;
          img.className = 'bg-logo' + (p.isCenter ? ' centered-logo' : '');

          if (p.top) img.style.top = p.top;
          if (p.bottom) img.style.bottom = p.bottom;
          if (p.left) img.style.left = p.left;
          if (p.right) img.style.right = p.right;

          container.appendChild(img);
          setTimeout(() => img.classList.add('visible'), 50);
        });

        currentBatchIndex = (currentBatchIndex + 1) % activeBatches.length;
      }, 1000);
    }

    function startRotation() {
      if (intervalId) clearInterval(intervalId);
      currentBatchIndex = 0;
      showNextLogoBatch();
      intervalId = setInterval(showNextLogoBatch, 3000);
    }

    function goToGame() {
      document.getElementById('screen-welcome').classList.add('hidden');
      document.getElementById('screen-game').classList.remove('hidden');
      currentMode = 'game';
      startRotation();
    }

    function goToWelcome() {
      document.getElementById('screen-game').classList.add('hidden');
      document.getElementById('screen-welcome').classList.remove('hidden');
      currentMode = 'welcome';
      startRotation();
    }

    startRotation();
  </script>
</body>
</html>
