<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kpop Bias Sorter - Lab</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Contenedor de logos animados en el fondo */
    #background-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .bg-logo {
      position: absolute;
      max-width: 180px;
      max-height: 90px;
      object-fit: contain;
      opacity: 0;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.15));
      transition: opacity 1.2s ease-in-out, transform 1.2s ease-in-out;
      transform: scale(0.9);
    }

    .bg-logo.visible {
      opacity: 0.35;
      transform: scale(1);
    }

    /* Contenido principal sobrepuesto */
    .content-box {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      padding: 2.5rem 2rem;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 90%;
      width: 400px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    p {
      color: #a0a0b0;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }

    .btn-back {
      display: inline-block;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(135deg, #6e8efb, #a777e3);
      padding: 10px 24px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-back:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(167, 119, 227, 0.4);
    }
  </style>
</head>
<body>

  <!-- Fondo animado -->
  <div id="background-container"></div>

  <!-- Tarjeta central del Laboratorio -->
  <div class="content-box">
    <h1>Laboratorio de Pruebas</h1>
    <p>Probando animaciones dinámicas de fondo con logos en rotación continua.</p>
    <a href="index.html" class="btn-back">Volver al Inicio</a>
  </div>

  <script>
    // Tandas de logos con nombres exactos de tu carpeta /logos
    const logoBatches = [
      // Tanda 1
      [
        { src: 'logos/PurpleKiss.png', top: '10%', left: '8%' },
        { src: 'logos/Aespa.png', top: '15%', right: '10%' },
        { src: 'logos/Itzy.png', bottom: '20%', left: '10%' },
        { src: 'logos/Fiftyfifty.png', bottom: '12%', right: '8%' },
        { src: 'logos/Kiiikiii.png', top: '45%', left: '42%' }
      ],
      // Tanda 2
      [
        { src: 'logos/Gfriend.png', top: '12%', left: '12%' },
        { src: 'logos/2NE1.png', top: '18%', right: '8%' },
        { src: 'logos/Nmixx.png', bottom: '22%', left: '8%' },
        { src: 'logos/Lesserafim.png', bottom: '10%', right: '12%' },
        { src: 'logos/Youngposse.png', top: '48%', left: '40%' }
      ],
      // Tanda 3
      [
        { src: 'logos/StayC.png', top: '8%', left: '10%' },
        { src: 'logos/Newjeans.png', top: '20%', right: '12%' },
        { src: 'logos/ARTMS.png', bottom: '25%', left: '12%' },
        { src: 'logos/Twice.png', bottom: '10%', right: '10%' },
        { src: 'logos/Oddyouth.png', top: '42%', left: '45%' }
      ],
      // Tanda 4
      [
        { src: 'logos/Mamamoo.png', top: '15%', left: '8%' },
        { src: 'logos/Illit.png', top: '12%', right: '12%' },
        { src: 'logos/Chuu.png', bottom: '18%', left: '10%' },
        { src: 'logos/Blackpink.png', bottom: '12%', right: '8%' },
        { src: 'logos/Atheart.png', top: '50%', left: '38%' }
      ],
      // Tanda 5
      [
        { src: 'logos/Viviz.png', top: '10%', left: '10%' },
        { src: 'logos/Rescene.png', top: '15%', right: '8%' },
        { src: 'logos/TripleS.png', bottom: '20%', left: '8%' },
        { src: 'logos/Bibi.png', bottom: '10%', right: '12%' },
        { src: 'logos/Izna.png', top: '45%', left: '40%' }
      ],
      // Tanda 6
      [
        { src: 'logos/Loossemble.png', top: '12%', left: '8%' },
        { src: 'logos/Ive.png', top: '18%', right: '10%' },
        { src: 'logos/Billie.png', bottom: '22%', left: '12%' },
        { src: 'logos/Everglow.png', bottom: '12%', right: '8%' },
        { src: 'logos/Ifeye.png', top: '48%', left: '42%' }
      ]
    ];

    let currentBatchIndex = 0;
    const container = document.getElementById('background-container');

    function showNextLogoBatch() {
      // 1. Desvanecer los logos actuales
      const currentLogos = container.querySelectorAll('.bg-logo');
      currentLogos.forEach(img => img.classList.remove('visible'));

      // 2. Esperar al desvanecimiento para cambiar las imágenes
      setTimeout(() => {
        container.innerHTML = '';
        const currentBatch = logoBatches[currentBatchIndex];

        currentBatch.forEach(data => {
          const img = document.createElement('img');
          img.src = data.src;
          img.className = 'bg-logo';

          if (data.top) img.style.top = data.top;
          if (data.bottom) img.style.bottom = data.bottom;
          if (data.left) img.style.left = data.left;
          if (data.right) img.style.right = data.right;

          container.appendChild(img);

          // Forzar refinamiento visual antes de activar transición
          setTimeout(() => img.classList.add('visible'), 50);
        });

        currentBatchIndex = (currentBatchIndex + 1) % logoBatches.length;
      }, 1000);
    }

    // Iniciar rotación cada 3 segundos
    showNextLogoBatch();
    setInterval(showNextLogoBatch, 3000);
  </script>
</body>
</html>
