<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio - Sorter Features</title>
  
  <!-- Librería para generar la foto/PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* ==========================================
       1. PALETAS DE COLORES Y TEMAS
       ========================================== */

    /* Pure Dark (Default) */
    :root {
      --bg-card: #0a0a0a;
      --card-border: #333333;
      --text-main: #ffffff;
      --text-title: #f5f5f5;
      --text-sub: #a3a3a3;
      --item-bg: #222222;
      --badge-bg: #333333;
      --badge-text: #e5e5e5;
    }

    /* Minimal Light */
    [data-theme="light"] {
      --bg-card: #ffffff;
      --card-border: #d4d4d4;
      --text-main: #171717;
      --text-title: #0a0a0a;
      --text-sub: #525252;
      --item-bg: #e5e5e5;
      --badge-bg: #d4d4d4;
      --badge-text: #171717;
    }

    /* Soft Pink */
    [data-theme="pink"] {
      --bg-card: #fbcfe8;
      --card-border: #f472b6;
      --text-main: #831843;
      --text-title: #831843;
      --text-sub: #db2777;
      --item-bg: #ffffff;
      --badge-bg: #f472b6;
      --badge-text: #ffffff;
    }

    /* Ocean Blue */
    [data-theme="blue"] {
      --bg-card: #0f172a;
      --card-border: #1e293b;
      --text-main: #f0f9ff;
      --text-title: #38bdf8;
      --text-sub: #7dd3fc;
      --item-bg: #1e293b;
      --badge-bg: #0284c7;
      --badge-text: #ffffff;
    }

    /* Forest Green */
    [data-theme="green"] {
      --bg-card: #064e3b;
      --card-border: #047857;
      --text-main: #ecfdf5;
      --text-title: #6ee7b7;
      --text-sub: #a7f3d0;
      --item-bg: #065f46;
      --badge-bg: #10b981;
      --badge-text: #064e3b;
    }

    /* SPECIAL: ARGENTINA */
    [data-theme="argentina"] {
      --bg-card: #ffffff;
      --card-border: #38bdf8;
      --text-main: #0c4a6e;
      --text-title: #0284c7;
      --text-sub: #38bdf8;
      --item-bg: #bae6fd;
      --badge-bg: #0284c7;
      --badge-text: #ffffff;
    }

    /* SPECIAL: BOCA JUNIORS */
    [data-theme="boca"] {
      --bg-card: #002244;
      --card-border: #ffcc00;
      --text-main: #ffffff;
      --text-title: #ffcc00;
      --text-sub: #ffcc00;
      --item-bg: #003366;
      --badge-bg: #ffcc00;
      --badge-text: #002244;
    }

    /* SPECIAL: RIVER PLATE */
    [data-theme="river"] {
      --bg-card: #ffffff;
      --card-border: #e50027;
      --text-main: #ffffff;
      --text-title: #e50027;
      --text-sub: #99001a;
      --item-bg: #e50027;
      --badge-bg: #700012;
      --badge-text: #ffffff;
    }

    /* ==========================================
       2. ESTRUCTURA Y ESTILOS
       ========================================== */
    body {
      background-color: #121212;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* CAMPO DE NOMBRE DE USUARIO */
    .user-input-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 340px;
    }

    .user-input-container label {
      font-size: 0.85rem;
      color: #a3a3a3;
      font-weight: 600;
    }

    .user-input-container input {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .user-input-container input:focus {
      border-color: #0284c7;
    }

    /* TARJETA DE RESULTADOS */
    .test-card {
      width: 340px;
      background: var(--bg-card);
      border: 3px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      box-sizing: border-box;
    }

    .test-title {
      color: var(--text-title);
      text-align: center;
      margin: 0;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      word-wrap: break-word;
    }

    .test-subtitle {
      color: var(--text-sub);
      text-align: center;
      font-size: 0.75rem;
      margin: 4px 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-num {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 35px;
      text-align: left;
      color: var(--text-main);
    }

    .rank-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .group-badge {
      font-size: 0.75rem;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 700;
    }

    /* PODIO (TOP 1, 2, 3) */
    .rank-item.top-1 {
      border: 2px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .rank-item.top-2 {
      border: 2px solid #c0c0c0;
      box-shadow: 0 0 8px rgba(192, 192, 192, 0.25);
    }

    .rank-item.top-3 {
      border: 2px solid #cd7f32;
      box-shadow: 0 0 8px rgba(205, 127, 50, 0.25);
    }

    /* SELECTOR DE TEMAS */
    .theme-selector {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .theme-info {
      font-size: 0.75rem;
      color: var(--text-title);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-align: center;
      background: rgba(0, 0, 0, 0.12);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .theme-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 280px;
    }

    .btn-theme {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff66;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .btn-theme:hover { transform: scale(1.2); }
    .btn-theme.active { border-color: #ffffff; transform: scale(1.15); box-shadow: 0 0 6px rgba(255,255,255,0.8); }

    .t-dark { background: #0a0a0a; }
    .t-light { background: #ffffff; }
    .t-pink { background: #f472b6; }
    .t-blue { background: #0284c7; }
    .t-green { background: #10b981; }
    .t-arg { background: linear-gradient(135deg, #7dd3fc 50%, #ffffff 50%); }
    .t-boca { background: linear-gradient(135deg, #002244 50%, #ffcc00 50%); }
    .t-river { background: linear-gradient(135deg, #ffffff 50%, #e50027 50%); }

    /* BOTONES DE ACCIÓN (VER / DESCARGAR) */
    .action-buttons {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-action {
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      background: #262626;
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover { background: #333333; transform: translateY(-2px); }
    .btn-download { background: #0284c7; }
    .btn-download:hover { background: #0369a1; }

    /* MODAL DE VISTA PREVIA */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #18181b;
      padding: 24px;
      border-radius: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      max-width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-close {
      position: absolute;
      top: 12px; right: 18px;
      font-size: 1.6rem;
      color: #a3a3a3;
      cursor: pointer;
      border: none;
      background: none;
    }

    .modal-close:hover { color: #ffffff; }
  </style>
</head>
<body>

  <h2>🔬 Laboratorio de Pruebas</h2>

  <!-- CAMPO PARA NOMBRE -->
  <div class="user-input-container">
    <label for="username-input">Personalizá tu tarjeta:</label>
    <input 
      type="text" 
      id="username-input" 
      placeholder="Escribí tu nombre..." 
      oninput="updateCardTitle()"
    />
  </div>

  <!-- TARJETA PRINCIPAL -->
  <div id="test-card" class="test-card">
    <h2 id="card-title" class="test-title">MY BIAS RANKING</h2>
    <p class="test-subtitle">K-Pop Bias Sorter</p>

    <div class="rank-list">
      <div class="rank-item top-1">
        <div class="rank-left">
          <span class="rank-num">🥇 1</span>
          <span class="rank-name">Ireh</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <div class="rank-item top-2">
        <div class="rank-left">
          <span class="rank-num">🥈 2</span>
          <span class="rank-name">SinB</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <div class="rank-item top-3">
        <div class="rank-left">
          <span class="rank-num">🥉 3</span>
          <span class="rank-name">Yuki</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">4.</span>
          <span class="rank-name">Yerin</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">5.</span>
          <span class="rank-name">Chaein</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>
    </div>

    <!-- SELECTOR DE TEMAS -->
    <div class="theme-selector">
      <div id="theme-name" class="theme-info">FONDO: PURE DARK</div>

      <div class="theme-buttons">
        <button class="btn-theme t-dark active" onclick="setTheme('', 'Pure Dark', event)" title="Pure Dark"></button>
        <button class="btn-theme t-light" onclick="setTheme('light', 'Minimal Light', event)" title="Minimal Light"></button>
        <button class="btn-theme t-pink" onclick="setTheme('pink', 'Soft Pink', event)" title="Soft Pink"></button>
        <button class="btn-theme t-blue" onclick="setTheme('blue', 'Ocean Blue', event)" title="Ocean Blue"></button>
        <button class="btn-theme t-green" onclick="setTheme('green', 'Forest Green', event)" title="Forest Green"></button>
        <button class="btn-theme t-arg" onclick="setTheme('argentina', 'Special Argentina', event)" title="Special Argentina"></button>
        <button class="btn-theme t-boca" onclick="setTheme('boca', 'Special Boca', event)" title="Special Boca"></button>
        <button class="btn-theme t-river" onclick="setTheme('river', 'Special River', event)" title="Special River"></button>
      </div>
    </div>
  </div>

  <!-- BOTONES VER IMAGEN Y DESCARGAR -->
  <div class="action-buttons">
    <button class="btn-action" onclick="showPreview()">👁️ Ver Imagen</button>
    <button class="btn-action btn-download" onclick="downloadCard()">📥 Descargar</button>
  </div>

  <!-- MODAL DE VISTA PREVIA -->
  <div id="preview-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <button class="modal-close" onclick="closePreview()">&times;</button>
      <h3 style="margin: 0; font-size: 1rem; color: #a3a3a3;">Vista Previa</h3>
      <div id="preview-area"></div>
    </div>
  </div>

  <script>
    // 1. Cambiar tema y etiqueta
    function setTheme(themeKey, themeLabel, evt) {
      const card = document.getElementById('test-card');
      const label = document.getElementById('theme-name');

      if (themeKey) {
        card.setAttribute('data-theme', themeKey);
      } else {
        card.removeAttribute('data-theme');
      }

      label.textContent = `FONDO: ${themeLabel}`;

      document.querySelectorAll('.btn-theme').forEach(btn => btn.classList.remove('active'));
      evt.target.classList.add('active');
    }

    // 2. Personalizar título con el nombre de usuario
    function updateCardTitle() {
      const nameInput = document.getElementById('username-input').value.trim();
      const cardTitle = document.getElementById('card-title');

      if (nameInput) {
        cardTitle.textContent = `TOP BIAS DE ${nameInput}`;
      } else {
        cardTitle.textContent = 'MY BIAS RANKING';
      }
    }

    // 3. Mostrar Vista Previa (Ver Imagen)
    function showPreview() {
      const card = document.getElementById('test-card');
      
      // Oculta temporalmente el selector de temas para capturar solo la tarjeta limpia
      const themeSelector = card.querySelector('.theme-selector');
      themeSelector.style.display = 'none';

      html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
        const previewArea = document.getElementById('preview-area');
        previewArea.innerHTML = '';
        
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        img.style.maxWidth = '100%';
        img.style.borderRadius = '16px';
        
        previewArea.appendChild(img);
        document.getElementById('preview-modal').style.display = 'flex';

        // Restaura el selector de temas
        themeSelector.style.display = 'flex';
      });
    }

    function closePreview() {
      document.getElementById('preview-modal').style.display = 'none';
    }

    // 4. Descargar Tarjeta PNG
    function downloadCard() {
      const card = document.getElementById('test-card');
      const themeSelector = card.querySelector('.theme-selector');
      themeSelector.style.display = 'none';

      html2canvas(card, { backgroundColor: null, scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'my-bias-ranking.png';
        link.href = canvas.toDataURL('image/png');
        link.click();

        themeSelector.style.display = 'flex';
      });
    }
  </script>
</body>
</html>
