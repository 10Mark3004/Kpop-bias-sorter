<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio - Podio con Medallas & Temas</title>
  <style>
    /* VARIABLES DE TEMAS */
    :root {
      --bg-card: #0d0a1a;
      --card-border: #2a2040;
      --text-main: #ffffff;
      --text-title: #f472b6;
      --text-sub: #a7f3d0;
      --item-bg: rgba(255, 255, 255, 0.05);
      --badge-bg: rgba(244, 114, 182, 0.15);
    }

    /* TEMA 2: PASTEL PINK */
    [data-theme="pink"] {
      --bg-card: #1f121b;
      --card-border: #f472b6;
      --text-title: #fbcfe8;
      --text-sub: #f472b6;
      --item-bg: rgba(244, 114, 182, 0.1);
      --badge-bg: rgba(244, 114, 182, 0.25);
    }

    /* TEMA 3: CYBERPUNK NEON */
    [data-theme="cyberpunk"] {
      --bg-card: #050b14;
      --card-border: #00f0ff;
      --text-title: #00f0ff;
      --text-sub: #ff007f;
      --item-bg: rgba(0, 240, 255, 0.07);
      --badge-bg: rgba(255, 0, 127, 0.2);
    }

    /* TEMA 4: DARK GOLD */
    [data-theme="gold"] {
      --bg-card: #120e06;
      --card-border: #eab308;
      --text-title: #fde047;
      --text-sub: #eab308;
      --item-bg: rgba(234, 179, 8, 0.08);
      --badge-bg: rgba(234, 179, 8, 0.2);
    }

    body {
      background-color: #07050d;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* CONTENEDOR PRINCIPAL */
    .test-card {
      width: 340px;
      background: var(--bg-card);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: all 0.3s ease;
    }

    .test-title {
      color: var(--text-title);
      text-align: center;
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 1px;
    }

    .test-subtitle {
      color: var(--text-sub);
      text-align: center;
      font-size: 0.75rem;
      margin: 4px 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* LISTA DEL RANKING */
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-num {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 35px;
      text-align: left;
      color: var(--text-main);
    }

    .rank-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .group-badge {
      font-size: 0.75rem;
      color: var(--text-title);
      background: var(--badge-bg);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* BORDES Y DESTELLOS DEL PODIO */
    .rank-item.top-1 {
      border: 2px solid #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.35);
      background: rgba(255, 215, 0, 0.08);
    }

    .rank-item.top-2 {
      border: 2px solid #e0e0e0;
      box-shadow: 0 0 10px rgba(224, 224, 224, 0.25);
      background: rgba(224, 224, 224, 0.06);
    }

    .rank-item.top-3 {
      border: 2px solid #cd7f32;
      box-shadow: 0 0 10px rgba(205, 127, 50, 0.25);
      background: rgba(205, 127, 50, 0.06);
    }

    /* SELECTOR DE TEMAS */
    .theme-selector {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .theme-title {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .theme-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-theme {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #ffffff33;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .btn-theme:hover { transform: scale(1.15); }
    .btn-theme.active { border-color: #ffffff; transform: scale(1.1); }

    .t-default { background: linear-gradient(135deg, #0d0a1a, #f472b6); }
    .t-pink { background: linear-gradient(135deg, #1f121b, #fbcfe8); }
    .t-cyber { background: linear-gradient(135deg, #050b14, #00f0ff); }
    .t-gold { background: linear-gradient(135deg, #120e06, #fde047); }
  </style>
</head>
<body>

  <h2>🔬 Laboratorio de Prueba</h2>

  <div id="test-card" class="test-card">
    <h2 class="test-title">MY BIAS RANKING</h2>
    <p class="test-subtitle">K-Pop Bias Sorter</p>

    <div class="rank-list">
      <!-- TOP 1 -->
      <div class="rank-item top-1">
        <div class="rank-left">
          <span class="rank-num">🥇 1</span>
          <span class="rank-name">Ireh</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <!-- TOP 2 -->
      <div class="rank-item top-2">
        <div class="rank-left">
          <span class="rank-num">🥈 2</span>
          <span class="rank-name">SinB</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <!-- TOP 3 -->
      <div class="rank-item top-3">
        <div class="rank-left">
          <span class="rank-num">🥉 3</span>
          <span class="rank-name">Yuki</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <!-- RESTO -->
      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">4.</span>
          <span class="rank-name">Yerin</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">5.</span>
          <span class="rank-name">Chaein</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>
    </div>

    <!-- SELECTOR DE TEMAS -->
    <div class="theme-selector">
      <span class="theme-title">Elegir Tema</span>
      <div class="theme-buttons">
        <button class="btn-theme t-default active" onclick="setTheme('', event)" title="Original"></button>
        <button class="btn-theme t-pink" onclick="setTheme('pink', event)" title="Pastel Pink"></button>
        <button class="btn-theme t-cyber" onclick="setTheme('cyberpunk', event)" title="Cyberpunk"></button>
        <button class="btn-theme t-gold" onclick="setTheme('gold', event)" title="Dark Gold"></button>
      </div>
    </div>
  </div>

  <script>
    function setTheme(themeName, evt) {
      const card = document.getElementById('test-card');
      if (themeName) {
        card.setAttribute('data-theme', themeName);
      } else {
        card.removeAttribute('data-theme');
      }

      document.querySelectorAll('.btn-theme').forEach(btn => btn.classList.remove('active'));
      evt.target.classList.add('active');
    }
  </script>
</body>
</html>
