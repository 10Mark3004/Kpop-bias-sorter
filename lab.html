<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio - Temas Limpios & Podio</title>
  <style>
    /* ==========================================
       1. DEFINICIÓN DE PALETAS Y TEMAS
       ========================================== */

    /* TEMA POR DEFECTO: Pure Dark (Base Negra / Letras Blancas) */
    :root {
      --bg-card: #0a0a0a;
      --card-border: #262626;
      --text-main: #ffffff;
      --text-title: #f5f5f5;
      --text-sub: #a3a3a3;
      --item-bg: #171717;
      --badge-bg: #262626;
      --badge-text: #e5e5e5;
    }

    /* TEMA 2: Minimal Light (Base Blanca / Letras Negras) */
    [data-theme="light"] {
      --bg-card: #ffffff;
      --card-border: #e5e5e5;
      --text-main: #171717;
      --text-title: #0a0a0a;
      --text-sub: #737373;
      --item-bg: #f5f5f5;
      --badge-bg: #e5e5e5;
      --badge-text: #262626;
    }

    /* TEMA 3: Soft Pink (Tonos Rosas) */
    [data-theme="pink"] {
      --bg-card: #fdf2f8;
      --card-border: #fbcfe8;
      --text-main: #831843;
      --text-title: #9d174d;
      --text-sub: #db2777;
      --item-bg: #fce7f3;
      --badge-bg: #fbcfe8;
      --badge-text: #9d174d;
    }

    /* TEMA 4: Ocean Blue (Celeste y Azul) */
    [data-theme="blue"] {
      --bg-card: #0f172a;
      --card-border: #1e293b;
      --text-main: #f0f9ff;
      --text-title: #38bdf8;
      --text-sub: #7dd3fc;
      --item-bg: #1e293b;
      --badge-bg: #0284c7;
      --badge-text: #ffffff;
    }

    /* TEMA 5: Forest Green (Tonos Verdes) */
    [data-theme="green"] {
      --bg-card: #064e3b;
      --card-border: #047857;
      --text-main: #ecfdf5;
      --text-title: #6ee7b7;
      --text-sub: #a7f3d0;
      --item-bg: #065f46;
      --badge-bg: #10b981;
      --badge-text: #064e3b;
    }


    /* ==========================================
       2. ESTILOS GENERALES Y ESTRUCTURA
       ========================================== */
    body {
      background-color: #121212;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    .test-card {
      width: 340px;
      background: var(--bg-card);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .test-title {
      color: var(--text-title);
      text-align: center;
      margin: 0;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .test-subtitle {
      color: var(--text-sub);
      text-align: center;
      font-size: 0.75rem;
      margin: 4px 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }

    /* LISTA DEL RANKING */
    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--item-bg);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid transparent;
      transition: all 0.25s ease;
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .rank-num {
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 35px;
      text-align: left;
      color: var(--text-main);
    }

    .rank-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .group-badge {
      font-size: 0.75rem;
      color: var(--badge-text);
      background: var(--badge-bg);
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* ==========================================
       3. PODIO (BORDES Y ILUMINACIÓN TOP 1, 2, 3)
       ========================================== */
    .rank-item.top-1 {
      border: 2px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.25);
    }

    .rank-item.top-2 {
      border: 2px solid #c0c0c0;
      box-shadow: 0 0 8px rgba(192, 192, 192, 0.2);
    }

    .rank-item.top-3 {
      border: 2px solid #cd7f32;
      box-shadow: 0 0 8px rgba(205, 127, 50, 0.2);
    }

    /* ==========================================
       4. BOTONES DEL SELECTOR DE TEMAS
       ========================================== */
    .theme-selector {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .theme-title {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .theme-buttons {
      display: flex;
      gap: 10px;
    }

    .btn-theme {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid #ffffff44;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
    }

    .btn-theme:hover { transform: scale(1.15); }
    .btn-theme.active { border-color: #ffffff; transform: scale(1.15); }

    .t-dark { background: #0a0a0a; }
    .t-light { background: #ffffff; }
    .t-pink { background: #fbcfe8; }
    .t-blue { background: #0284c7; }
    .t-green { background: #10b981; }
  </style>
</head>
<body>

  <h2>🔬 Laboratorio: Paletas de Color</h2>

  <div id="test-card" class="test-card">
    <h2 class="test-title">MY BIAS RANKING</h2>
    <p class="test-subtitle">K-Pop Bias Sorter</p>

    <div class="rank-list">
      <!-- TOP 1 -->
      <div class="rank-item top-1">
        <div class="rank-left">
          <span class="rank-num">🥇 1</span>
          <span class="rank-name">Ireh</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <!-- TOP 2 -->
      <div class="rank-item top-2">
        <div class="rank-left">
          <span class="rank-num">🥈 2</span>
          <span class="rank-name">SinB</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <!-- TOP 3 -->
      <div class="rank-item top-3">
        <div class="rank-left">
          <span class="rank-num">🥉 3</span>
          <span class="rank-name">Yuki</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>

      <!-- RESTO -->
      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">4.</span>
          <span class="rank-name">Yerin</span>
        </div>
        <span class="group-badge">GFRIEND</span>
      </div>

      <div class="rank-item">
        <div class="rank-left">
          <span class="rank-num">5.</span>
          <span class="rank-name">Chaein</span>
        </div>
        <span class="group-badge">Purple Kiss</span>
      </div>
    </div>

    <!-- SELECTOR DE TEMAS -->
    <div class="theme-selector">
      <span class="theme-title">Elegir Tema</span>
      <div class="theme-buttons">
        <button class="btn-theme t-dark active" onclick="setTheme('', event)" title="Pure Dark"></button>
        <button class="btn-theme t-light" onclick="setTheme('light', event)" title="Minimal Light"></button>
        <button class="btn-theme t-pink" onclick="setTheme('pink', event)" title="Soft Pink"></button>
        <button class="btn-theme t-blue" onclick="setTheme('blue', event)" title="Ocean Blue"></button>
        <button class="btn-theme t-green" onclick="setTheme('green', event)" title="Forest Green"></button>
      </div>
    </div>
  </div>

  <script>
    function setTheme(themeName, evt) {
      const card = document.getElementById('test-card');
      if (themeName) {
        card.setAttribute('data-theme', themeName);
      } else {
        card.removeAttribute('data-theme');
      }

      document.querySelectorAll('.btn-theme').forEach(btn => btn.classList.remove('active'));
      evt.target.classList.add('active');
    }
  </script>
</body>
</html>
